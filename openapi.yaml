openapi: 3.0.0
info:
  title: noteworthy web service
  version: 0.0.1

servers:
  - url: http://127.0.0.1:8080
    description: local

paths:
  /rooms:
    post:
      summary: Create a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500":
          $ref: '#/components/responses/ServerError'
  /rooms/{roomId}/connect:
    post:
      summary: Ask to connect to a room
      parameters:
        - $ref: '#/components/parameters/roomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Successfully asked
        "500":
          $ref: '#/components/responses/ServerError'
  /rooms/{roomId}/:
    parameters:
      - $ref: '#/components/parameters/roomId'
    get:
      summary: Get the current state of room by its id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Send the room as json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete the room
      security:
        - bearerAuth: ['owner']
      responses:
        "200":
          description: Deleted
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/ServerError'
  /rooms/{roomId}/export:
    get:
      description: export the room as pdf or as a json
      parameters:
      - $ref: '#/components/parameters/roomId'
      security:
        - bearerAuth: []
      responses:
        "200":
          description: exported the room
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/ServerError'
  /rooms/{roomId}/pages:
    parameters:
      - $ref: '#/components/parameters/roomId'
    get:
      summary: Get the current state of a page by its id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Send the page as json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/ServerError'
  /rooms/{roomId}/users:
    parameters:
      - $ref: '#/components/parameters/roomId'
    get:
      summary: Get a list of users in a room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: send list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/ServerError'


components:
  parameters:
    roomId:
      in: path
      name: roomId
      required: true
      schema:
        type: string
        minLength: 5
        maxLength: 5
      description: The room's ID

  schemas:
    User:
      required:
        - username
      properties:
        username:
          type: string
        roomId:
          type: string
          minLength: 5
          maxLength: 5
        sessionId:
          type: string
        isOwner:
          type: boolean
    Room:
      required:
        - id
        - pages
      properties:
        id: 
          type: string
          minLength: 5
          maxLength: 5
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    Page:
      required:
        - pageId
        - content
      properties:
        pageId:
          type: string
        content:
          type: array
          items:
            oneOf: 
              - $ref: '#/components/schemas/TextBox'
              - $ref: '#/components/schemas/Shape'
              - $ref: '#/components/schemas/Symbol'
              - $ref: '#/components/schemas/Stroke'
    Box:
      type: array
      description: "Format: [minx, miny, maxx, maxy]"
      minItems: 4
      maxItems: 4
      items:
        type: number
    Stroke:
      required:
        - id
        - type
        - box
        - points
      properties:
        id:
          description: Universal ID
          type:
            string
        type:
          type: string
          enum:
            - stroke
        box:
          $ref: '#/components/schemas/Box'
        points:
          description: list of points, in the form x1, y1, x2, y2, ...
          type: array
          items:
            type: number
    TextBox:
      required:
        - id
        - type
        - box
        - text
      properties:
        id:
          description: Universal ID
          type: string
        type:
          type: string
          enum:
            - textbox
        box:
          $ref: '#/components/schemas/Box'
        text:
          description: the text in the box
          type: string
    Shape:
      required:
        - id
        - type
        - shapeType
        - angle
        - box
      properties:
        id:
          description: Universal ID
          type: string
        type:
          type: string
          enum:
            - shape
        shapeType:
          type: string
        angle:
          description: In degrees
          type: number
        box:
          $ref: '#/components/schemas/Box'
    Symbol:
      required:
        - id
        - type
        - symbolRes
        - box
      properties:
        id:
          description: Universal ID
          type: string
        type:
          type: string
          enum:
            - symbol
        symbolRes:
          description: string
          type: string
        angle:
          description: In degrees
          type: number
        box:
          $ref: '#/components/schemas/Box'
          
  
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: uuid

  responses:
    ServerError:
      description: server error
      content:
        text/plain:
          schema:
            type: string
    UnauthorizedError:
      description: Access token is missing or invalid