
stages:
  - build

variables:
  DOCKER_HOST: tcp://docker:2375/   # Needed to use Docker-in-Docker
  DOCKER_DRIVER: overlay2           # Use overlay storage driver

services:
  - docker:dind                     # Docker-in-Docker service

before_script:
  - docker info                     # Check Docker installation and version

build_project:
  stage: build
  script:
    - docker-compose up -d          # Run Docker Compose in detached mode
    - docker-compose ps             # Show running containers for verification
  only:
    - main                          # Run on the main branch or adjust as needed

# Optional: Include a cleanup step
after_script:
  - docker-compose down             # Bring down containers to clean up


